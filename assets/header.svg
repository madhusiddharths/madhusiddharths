<svg width="860" height="240" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Madhu Siddharth Suthagar — Data Analyst / Data Scientist · Chicago, IL">
  <style>
    text { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .titlebar-text { fill: #8b949e; font-size: 13px; }
    .prompt { fill: #00e5ff; font-size: 16px; }
    .cmd { fill: #c9d1d9; font-size: 16px; }
    .name { fill: #00ff9c; font-size: 34px; font-weight: 700; }
    .sub { fill: #00e5ff; font-size: 15px; }
    .dim { fill: #8b949e; font-size: 14px; }
    .fade { opacity: 0; animation: fadeup 0.5s ease-out forwards; }
    .d1 { animation-delay: 0.3s; }
    .d2 { animation-delay: 0.9s; }
    .d3 { animation-delay: 1.5s; }
    .d4 { animation-delay: 1.9s; }
    .d5 { animation-delay: 2.3s; }
    @keyframes fadeup {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .glowpulse { animation: pulse 3s ease-in-out 2.4s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    .cursor { fill: #00ff9c; animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { opacity: 0; } }
    .scan { animation: scanmove 6s linear 2.8s infinite; opacity: 0; }
    @keyframes scanmove {
      0% { transform: translateY(-30px); opacity: 1; }
      100% { transform: translateY(250px); opacity: 1; }
    }
    .borderpulse { animation: borderglow 4s ease-in-out infinite; }
    @keyframes borderglow { 0%, 100% { stroke-opacity: 0.25; } 50% { stroke-opacity: 0.65; } }
  </style>
  <defs>
    <clipPath id="win"><rect x="1" y="1" width="858" height="238" rx="12"/></clipPath>
    <filter id="glowf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scangrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="borderpulse" x="1" y="1" width="858" height="238" rx="12" fill="#0d1117" stroke="#00ff9c"/>

  <g clip-path="url(#win)">
    <rect x="1" y="1" width="858" height="36" fill="#161b22"/>
    <circle cx="27" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="49" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="71" cy="19" r="6" fill="#27c93f"/>
    <text x="430" y="24" text-anchor="middle" class="titlebar-text">madhu@chicago:~/profile</text>

    <rect class="scan" x="1" y="0" width="858" height="30" fill="url(#scangrad)"/>

    <g class="fade d1">
      <text x="30" y="76"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>
    </g>
    <g class="fade d2" filter="url(#glowf)">
      <text x="30" y="122" class="name glowpulse">Madhu Siddharth Suthagar</text>
    </g>
    <g class="fade d3">
      <text x="30" y="156" class="sub">Data Analyst / Data Scientist  ·  Chicago, IL</text>
    </g>
    <g class="fade d4">
      <text x="30" y="184" class="dim">MS in Data Science · Illinois Institute of Technology · May 2026 · GPA 3.77</text>
    </g>
    <g class="fade d5">
      <text x="30" y="216" class="prompt">$</text>
      <rect class="cursor" x="48" y="203" width="10" height="17"/>
    </g>
  </g>
</svg>
