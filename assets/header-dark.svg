<svg width="1000" height="186" viewBox="0 0 1000 186" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Madhu Siddharth Suthagar — Data Scientist and Data Analyst — Chicago, IL — M.S. in Data Science, Illinois Institute of Technology (May 2026), GPA 3.77">
  <defs>
    <pattern id="grid-d" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ecece7" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade-d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.74" stop-color="#000000"/>
    </linearGradient>
    <mask id="mask-d">
      <rect width="1000" height="186" fill="url(#fade-d)"/>
    </mask>
    <clipPath id="clip-d">
      <rect x="0.75" y="0.75" width="998.5" height="184.5" rx="16"/>
    </clipPath>
    <style>
      .name-d { font: 700 44px 'Helvetica Neue','Segoe UI',Helvetica,Arial,sans-serif; letter-spacing: -1.3px; fill: #ecece7; }
      .eye-d  { font: 600 12.5px 'SFMono-Regular','SF Mono','Menlo','Consolas',monospace; letter-spacing: 3px; }
      .meta-d { font: 400 14px 'Helvetica Neue','Segoe UI',Helvetica,Arial,sans-serif; fill: #a4a39b; }
      .mark-d { font: 700 15px 'SFMono-Regular','SF Mono','Menlo','Consolas',monospace; letter-spacing: 0.5px; fill: #0a0a0d; }
    </style>
  </defs>

  <!-- near-black canvas -->
  <rect x="0.75" y="0.75" width="998.5" height="184.5" rx="16" fill="#0a0a0d"/>

  <g clip-path="url(#clip-d)">
    <!-- graph-paper grid, faded from the top -->
    <rect width="1000" height="186" fill="url(#grid-d)" mask="url(#mask-d)"/>

    <!-- trend-line plot -->
    <g>
      <line x1="762" y1="114" x2="986" y2="114" stroke="#ecece7" stroke-opacity="0.12" stroke-width="1"/>
      <polyline points="770,106 804,110 838,80 872,92 906,62 940,70 974,42"
        fill="none" stroke="#8b74ff" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
      <g fill="#8b74ff" fill-opacity="0.65">
        <circle cx="770" cy="106" r="2.8"/>
        <circle cx="804" cy="110" r="2.8"/>
        <circle cx="838" cy="80" r="2.8"/>
        <circle cx="872" cy="92" r="2.8"/>
        <circle cx="906" cy="62" r="2.8"/>
        <circle cx="940" cy="70" r="2.8"/>
      </g>
      <circle cx="974" cy="42" r="8" fill="#8b74ff" opacity="0.18"/>
      <circle cx="974" cy="42" r="4.25" fill="#8b74ff"/>
    </g>
  </g>

  <!-- monogram -->
  <rect x="44" y="26" width="36" height="36" rx="9" fill="#ecece7"/>
  <text x="62" y="49.5" text-anchor="middle" class="mark-d">MS</text>

  <!-- eyebrow -->
  <text x="96" y="49" class="eye-d"><tspan fill="#a4a39b">DATA SCIENTIST</tspan><tspan fill="#8b74ff">&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#a4a39b">DATA ANALYST</tspan></text>

  <!-- name -->
  <text x="43" y="108" class="name-d">Madhu Siddharth Suthagar</text>

  <!-- meta -->
  <text x="44" y="145" class="meta-d"><tspan fill="#a4a39b">Chicago, IL</tspan><tspan fill="#8b74ff" fill-opacity="0.9">&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#a4a39b">M.S. in Data Science, Illinois Institute of Technology (May 2026)</tspan><tspan fill="#8b74ff" fill-opacity="0.9">&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#a4a39b">GPA 3.77</tspan></text>

  <!-- frame -->
  <rect x="0.75" y="0.75" width="998.5" height="184.5" rx="16" fill="none" stroke="#ecece7" stroke-opacity="0.14" stroke-width="1"/>
</svg>
