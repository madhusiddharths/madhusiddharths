<svg width="860" height="16" viewBox="0 0 860 16" xmlns="http://www.w3.org/2000/svg" role="presentation" aria-hidden="true">
  <style>
    .comet { animation: sweep 3.2s linear infinite; }
    @keyframes sweep {
      from { transform: translateX(-170px); }
      to { transform: translateX(880px); }
    }
  </style>
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#00ff9c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="1"/>
    </linearGradient>
    <filter id="dg" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="0" y1="8" x2="860" y2="8" stroke="#00ff9c" stroke-opacity="0.18" stroke-width="1"/>
  <rect class="comet" x="0" y="6.5" width="160" height="3" rx="1.5" fill="url(#cg)" filter="url(#dg)"/>
</svg>
